name: Update GitHub Profile

on:
schedule:
- cron: "0 3 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
update-profile:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  # ----------------------------------------
  # GitHub Stats
  # ----------------------------------------

  - name: Generate GitHub Stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: username=rmunoz-c&show_icons=true&theme=radical
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------
  # Top Languages
  # ----------------------------------------

  - name: Generate Top Languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: username=rmunoz-c&layout=compact&theme=radical
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------
  # GitHub Trophies
  # ----------------------------------------

  - name: Generate GitHub Trophies
    uses: soulteary/github-profile-trophy-action@v1
    with:
      options: username=rmunoz-c&theme=darkhub
      path: profile/trophies.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------
  # Commit generated files
  # ----------------------------------------

  - name: Commit generated files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/*.svg

      git diff --cached --quiet || git commit -m "chore: update GitHub profile stats"

      git push
```
